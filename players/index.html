<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>KHC Dragons H1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
html{color-scheme:light}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--topbar);color:var(--on-top)}
.gate-card{width:100%;max-width:400px;background:var(--surface);color:var(--ink);border-radius:14px;padding:26px 24px;box-shadow:0 18px 50px rgba(0,0,0,.35);border-top:4px solid var(--red)}
.gate-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gate h1{font:800 1.7rem/1 var(--f-d);text-transform:uppercase;letter-spacing:.03em;margin:0}
.gate .sub{margin:2px 0 18px;color:var(--ink2);font-size:.95rem}
.gate label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.gate input[type=password],.gate input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:11px 12px;border:1px solid var(--axis);border-radius:8px;background:var(--surface2);color:var(--ink)}
.gate input:focus-visible,.gate button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.gate .row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:.9rem;color:var(--ink2)}
.gate .row input{width:18px;height:18px}
.gate button{width:100%;font:700 1.05rem var(--f-b);padding:12px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
.gate button:disabled{opacity:.6;cursor:default}
.gate .msg{min-height:1.4em;margin:12px 0 0;font-size:.92rem;font-weight:600;color:var(--loss)}
.gate .foot{margin:16px 0 0;font-size:.8rem;color:var(--muted)}
.land{display:grid;gap:10px;margin-top:8px}
.land a{display:block;text-align:center;text-decoration:none;font:700 1.05rem var(--f-b);padding:13px;border-radius:8px;background:var(--navy);color:#fff}


/* Opbouw: vaste donkerblauwe balk bovenaan, daaronder één zichtbare pagina (start, competitie, ploeg of bijlagen) met eigen tabbladen. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface2:#f7f8fa; --ink:#101a28; --ink2:#465266; --muted:#748092; --line:#dde2e9;
  --navy:#082342; --red:#bc0e31; --gold:#9b8257; --topbar:#082342; --on-top:#ffffff; --plate:#ffffff;
  --grid:#e4e8ee; --axis:#c3cad4; --band:#eef1f5; --band2:#dde3ea; --mark:#22395b; --mark2:#c5cdd9; --hl:#bc0e31; --hl2:#f1c4cd;
  --win:#1f8a55; --draw:#727d8e; --loss:#c7283f; --on-mark:#ffffff; --on-status:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --club-mark:var(--mark); --on-club:var(--on-mark); --club-soft:color-mix(in srgb, var(--club-mark) 30%, var(--surface));
  --f-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-b:Barlow,"Segoe UI",system-ui,sans-serif;
  --bar:54px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#061223; --surface:#0c1d35; --surface2:#102543; --ink:#e9eef5; --ink2:#b3bfd0; --muted:#8392a8; --line:#1e3454;
  --navy:#0a2a50; --red:#f0506e; --gold:#c4ae82; --topbar:#041020;
  --grid:#1b304e; --axis:#35496a; --band:#132a49; --band2:#1d3859; --mark:#93a7c4; --mark2:#33486a; --hl:#f0506e; --hl2:#5a2030;
  --win:#2ea36b; --draw:#6f7b8f; --loss:#d9485c; --on-mark:#0b1220;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#061223; --surface:#0c1d35; --surface2:#102543; --ink:#e9eef5; --ink2:#b3bfd0; --muted:#8392a8; --line:#1e3454;
  --navy:#0a2a50; --red:#f0506e; --gold:#c4ae82; --topbar:#041020;
  --grid:#1b304e; --axis:#35496a; --band:#132a49; --band2:#1d3859; --mark:#93a7c4; --mark2:#33486a; --hl:#f0506e; --hl2:#5a2030;
  --win:#2ea36b; --draw:#6f7b8f; --loss:#d9485c; --on-mark:#0b1220;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark }
.team{--club-mark:var(--cm-l); --on-club:#ffffff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .team{--club-mark:var(--cm-d); --on-club:#0b1220} }
:root[data-theme="dark"] .team{--club-mark:var(--cm-d); --on-club:#0b1220}

*{box-sizing:border-box}
/* admin: invulvelden, tellers en wachtwoorden */
.adm textarea.fld{display:block;width:100%;min-height:2.6em;resize:vertical;font:inherit;font-size:.92rem;line-height:1.4;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.adm textarea.fld:focus-visible,.pw input:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.adm textarea.fld.has{background:var(--surface);border-color:var(--win)}
.adm textarea.fld:disabled{opacity:.6}
.fs{display:block;min-height:1em;font-size:.72rem;color:var(--muted);margin-top:2px}
.fs.err{color:var(--loss);font-weight:600}
.dn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap;cursor:pointer}
.dn input{width:18px;height:18px;accent-color:var(--win)}
.cnt{display:inline-block;min-width:3.4em;padding:2px 8px;border-radius:999px;background:var(--band);font-weight:600;font-size:.85rem}
.cnt.full{background:var(--win);color:var(--on-status)} .cnt.some{background:var(--hl2)}
.dbstate{font-weight:600;padding:8px 12px;border-radius:8px;background:var(--band);max-width:68ch}
.dbstate.ok{background:color-mix(in srgb,var(--win) 18%,var(--surface))} .dbstate.bad{background:var(--hl2)}
.pwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:14px 0 18px}
.pw{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.pw h3{margin:0 0 2px} .pw label{font-size:.85rem;font-weight:600;margin-top:6px}
.pw input[type=password],.pw input[type=text]{font:inherit;padding:9px 10px;border:1px solid var(--axis);border-radius:6px;background:var(--surface2);color:var(--ink);width:100%}
.pw .btn{margin-top:10px;align-self:flex-start;border:0;cursor:pointer;font:inherit;font-weight:700}
.pw .btn:disabled{opacity:.5;cursor:default}
.pwstate{margin:0;font-size:.9rem;color:var(--ink2)} .pwstate.set{color:var(--win);font-weight:600}
.pwmsg{margin:4px 0 0;font-size:.88rem;min-height:1.2em} .pwmsg.err{color:var(--loss);font-weight:600} .pwmsg.ok{color:var(--win);font-weight:600}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:inherit}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:20px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}

/* bovenbalk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--topbar);color:var(--on-top);border-bottom:3px solid var(--red)}
.top-in{display:flex;align-items:center;gap:14px;height:var(--bar)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-d);font-weight:800;font-size:1.25rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand small{font-weight:600;color:var(--gold);font-size:.8em;letter-spacing:.08em}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav a,.nav button{font:600 .95rem var(--f-b);color:var(--on-top);background:none;border:0;padding:8px 12px;border-radius:6px;text-decoration:none;cursor:pointer;white-space:nowrap;opacity:.82}
.nav a:hover,.nav button:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav [aria-current="page"],.nav button[aria-expanded="true"]{opacity:1;box-shadow:inset 0 -3px 0 var(--gold);border-radius:6px 6px 0 0}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:7px;overflow:hidden;flex:none}
.lang button{font:700 .8rem var(--f-b);letter-spacing:.04em;color:var(--on-top);background:none;border:0;padding:5px 9px;cursor:pointer;opacity:.7}
.lang button:hover{opacity:1}
.lang button[aria-pressed="true"]{background:rgba(255,255,255,.92);color:var(--topbar);opacity:1}
.menu{position:absolute;left:0;right:0;top:100%;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 18px 40px rgba(4,16,32,.28)}
.menu-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;padding-block:16px}
.menu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:600}
.menu a:hover{background:var(--band)}
.menu a small{margin-left:auto;color:var(--muted);font-weight:500}

/* logo's: altijd op een wit plaatje, ook in het donker */
.lg{display:inline-block;flex:none;background-color:var(--plate);background-repeat:no-repeat;background-position:center;background-size:82%;border-radius:22%}
.lg.s{width:26px;height:26px} .lg.m{width:46px;height:46px} .lg.l{width:92px;height:92px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* koppen */
.eyebrow{font:600 .8rem var(--f-b);letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
h1{font-family:var(--f-d);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
.content h2{font:700 1.5rem/1.1 var(--f-d);letter-spacing:.03em;text-transform:uppercase;margin:36px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line);text-wrap:balance}
.content .panel>h2:first-child,.content>h2:first-child{margin-top:8px}
.content h3{font:700 1.06rem var(--f-b);margin:26px 0 8px;color:var(--ink)}
.content p{margin:0 0 12px;max-width:78ch}
.content p.lead{font-size:1.14rem;line-height:1.5;color:var(--ink);max-width:70ch;margin-bottom:16px}
.content p.cap,figcaption{font-size:.84rem;color:var(--muted);margin:6px 0 16px;max-width:90ch}
.content{padding-block:22px 64px}
.bl,.nl{margin:0 0 14px;padding-left:22px;max-width:82ch} .bl li,.nl li{margin-bottom:7px} .nl li::marker{font-weight:700;color:var(--club-mark)} .bl li::marker{color:var(--club-mark)}
.more{margin-top:14px} .more a{font-weight:600}
.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:600;margin:4px 8px 4px 0}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.team .btn{background:var(--club);color:var(--club-on)}

/* startpagina */
.hero{background:var(--navy);color:#fff;border-bottom:1px solid var(--line)}
.hero-in{display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between;padding-block:44px 40px}
.hero .eyebrow{color:var(--gold)} .hero h1{font-size:clamp(3.2rem,10vw,6.4rem)} .hero h1 span{color:#e8254a;display:block}
.hero-sub{font-size:1.25rem;font-weight:600;margin:14px 0 4px} .hero-meta{color:#c5cfdd;margin:0;font-size:.95rem}
.next{display:grid;gap:8px;background:#fff;color:#101a28;text-decoration:none;border-radius:14px;padding:18px 20px;min-width:min(100%,300px);box-shadow:0 14px 40px rgba(0,0,0,.3)}
.next-l{font:700 .78rem var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:#bc0e31}
.next-m{display:flex;align-items:center;gap:12px;font:800 1.5rem var(--f-d);text-transform:uppercase;letter-spacing:.02em} .next-m b{flex:1;text-align:center}
.next-d{font-size:.92rem;color:#465266} .next-go{font-weight:700;background:var(--club);color:var(--club-on);padding:8px 12px;border-radius:8px;text-align:center}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.tcard{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;overflow:hidden;padding-bottom:12px;transition:transform .12s}
.tcard:hover{transform:translateY(-2px);border-color:var(--muted)}
.tc-top{display:flex;align-items:flex-end;justify-content:space-between;background:var(--club);color:var(--club-on);padding:12px 14px 0;height:58px;margin-bottom:22px}
.tc-top .lg{transform:translateY(18px);box-shadow:0 2px 8px rgba(0,0,0,.25)} .tc-rank{font:800 1.7rem var(--f-d);align-self:center}
.tc-name{font:800 1.35rem var(--f-d);text-transform:uppercase;letter-spacing:.02em;padding-inline:14px}
.tc-line{color:var(--ink2);font-size:.92rem;padding-inline:14px} .tcard .chips{padding-inline:14px}
.tc-foot{font-size:.84rem;color:var(--muted);padding:4px 14px 0}

/* paginakop competitie / bijlagen */
.phead{background:var(--navy);color:#fff;padding-block:28px 22px} .phead .eyebrow{color:var(--gold)} .phead h1{font-size:clamp(2.2rem,6vw,3.6rem);margin-bottom:10px}
.phead p.lead{color:#e3e9f1;max-width:78ch;margin:0 0 14px} .phead .kpis{margin:0}

/* ploegkop in clubkleur */
.thead{background:var(--club);color:var(--club-on);border-bottom:4px solid var(--club2)}
.thead-in{display:grid;grid-template-columns:1fr auto;gap:18px 24px;align-items:center;padding-block:26px 20px}
.tid{display:flex;gap:20px;align-items:center;min-width:0} .tid h1{font-size:clamp(2.3rem,7vw,4.4rem)} .tmeta{margin:8px 0 0;opacity:.9}
.thead .eyebrow{opacity:.85}
.tswitch{display:flex;align-items:center;gap:6px}
.teamsel{font:600 .95rem var(--f-b);padding:8px 10px;border-radius:8px;border:1.5px solid color-mix(in srgb,var(--club-on) 45%,transparent);background:transparent;color:var(--club-on);max-width:190px}
.teamsel option{color:#101a28;background:#fff}
.arrow{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;text-decoration:none;font-size:1.5rem;line-height:1;border:1.5px solid color-mix(in srgb,var(--club-on) 45%,transparent)}
.tkpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tkpis .kpi{background:color-mix(in srgb,var(--club-on) 11%,transparent);border-radius:8px;padding:9px 12px}
.kpi b{display:block;font:800 1.7rem/1 var(--f-d)} .kpi span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 18px}
.kpis .kpi{background:rgba(255,255,255,.09);border-radius:8px;padding:9px 12px} .kpis .kpi.hot b{color:#ff6b86}

/* tabbladen */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar) + 3px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;padding:13px 13px 11px;text-decoration:none;font-weight:600;font-size:.95rem;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)} .tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--club-mark)}

/* tabellen */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 6px}
.tw+.tw,.cap+.tw{margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem} .tw.wide table{min-width:680px}
th{font:600 .74rem var(--f-b);letter-spacing:.07em;text-transform:uppercase;text-align:left;color:var(--ink2);background:var(--band);padding:9px 10px;white-space:nowrap}
thead.h-good th{box-shadow:inset 0 -3px 0 var(--win)} thead.h-bad th{box-shadow:inset 0 -3px 0 var(--loss)}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.grp td{background:var(--surface2);font:700 .78rem var(--f-b);letter-spacing:.1em;color:var(--ink2)} tr.mut td{color:var(--muted)} tr.me td{background:color-mix(in srgb,var(--hl) 9%,var(--surface))}
td.tot{background:var(--surface2);font-weight:700} .ac{text-align:center} .ar{text-align:right}
.c-hl{color:var(--hl)} .c-muted{color:var(--muted)} .c-2{color:var(--ink2)} .c-good{color:var(--win)} .c-gold{color:var(--gold)} .c-strong{color:var(--ink)}
.sub2{display:block;font-size:.84em;color:var(--muted);font-weight:400}
.res{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:5px;font:700 .76rem var(--f-b);color:var(--on-status)}
.res-w{background:var(--win)} .res-g{background:var(--draw)} .res-v{background:var(--loss)} .chips{display:flex;gap:3px}
.tl{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:600} .tl:hover span:last-child{text-decoration:underline}

/* kaders, figuren */
.call{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ink2);border-radius:4px 10px 10px 4px;padding:14px 18px;margin:0 0 16px;max-width:92ch}
.call h4{margin:0 0 6px;font:700 .78rem var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)} .call p,.call ul{margin:0} .call ul{padding-left:20px} .call li{margin-bottom:5px}
.call.t-hl{border-left-color:var(--hl)} .call.t-gold{border-left-color:var(--gold)} .call.t-strong{border-left-color:var(--club-mark)}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:4px 0 6px}
.glance>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.glance h4{margin:0 0 8px;font:800 1.15rem var(--f-d);text-transform:uppercase;letter-spacing:.04em} .glance ul{margin:0;padding-left:20px} .glance li{margin-bottom:5px}
.dt{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 8px;overflow:hidden}
.dt summary{cursor:pointer;padding:12px 16px;font-weight:600} .dt[open] summary{border-bottom:1px solid var(--line)} .dt .tw{border:0;border-radius:0;margin:0}
.content a[target]{color:var(--club-mark);font-weight:600}
.fig{margin:0 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px}
.fig .sc{overflow-x:auto} .fig figcaption{margin:8px 0 2px}
svg.ch{display:block;width:100%;height:auto;min-width:calc(var(--w) * 1.04px);max-width:calc(var(--w) * 1.55px);margin-inline:auto}
svg.ch *{stroke-linejoin:round;stroke-linecap:butt}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:6px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.86rem;padding-block:18px 28px}

@media (max-width:760px){
  .tw.wide.adm table{min-width:0} .adm table,.adm tbody,.adm tr,.adm td{display:block;width:auto} .adm colgroup,.adm thead{display:none}
  .adm tr{padding:10px 12px;border-bottom:1px solid var(--line)} .adm td{padding:3px 0;border:0;text-align:left}
  body{font-size:15px} .wrap{padding-inline:16px}
  .brand>span:not(.lg){display:none} .top-in{gap:6px} .nav{margin-left:auto;min-width:0;overflow-x:auto} .nav a,.nav button{padding:8px 7px;font-size:.9rem} .lang button{padding:5px 7px}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px} .tc-name{font-size:1.15rem}
  .thead-in{grid-template-columns:1fr} .tswitch{order:-1;justify-content:space-between} .teamsel{flex:1;max-width:none}
  .tid{gap:14px} .lg.l{width:68px;height:68px} .tkpis{grid-template-columns:repeat(3,1fr)}
  .hero-in{padding-block:28px}
